# The lint set is deliberately small and probationary: every check here
# must catch what go vet cannot without crying wolf. Grow it on purpose;
# drop a check the moment its noise outweighs its findings.
version: "2"

linters:
  default: none
  enable:
    - exhaustive # switches over enums (agent events, plugin states) name every member
    - depguard # the import boundaries between kernel, contracts, shell and plugins
    - ineffassign
    - staticcheck
    - unused
  settings:
    exhaustive:
      # A default case catches the zero value; every named member must
      # still stand above it as its own case.
      default-signifies-exhaustive: false
    depguard:
      # The kit (github.com/xleotranx/wada-kit) brings the kernel, the shell
      # contract, settings sections and the palette; only main installs the
      # kit's shell and plugins.
      rules:
        contract:
          files: ["**/internal/contract/**/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo/ui"
            - "github.com/xleotranx/wada-kit/kernel"
            - "github.com/xleotranx/wada-kit/contract"
            - "wada-desktop-go/internal/contract"
        plugins:
          files: ["**/internal/plugins/**/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo"
            - "github.com/oneo-me/onevra/source"
            - "github.com/xleotranx/wada-kit/kernel"
            - "github.com/xleotranx/wada-kit/contract"
            - "github.com/xleotranx/wada-kit/native"
            - "wada-desktop-go/internal/contract"
        plugintest:
          files: ["**/internal/plugintest/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo/ui"
            - "github.com/xleotranx/wada-kit/kernel"
            - "github.com/xleotranx/wada-kit/contract"
            - "wada-desktop-go/internal/contract"
