# The gate from the Makefile, parked: `on` carries only workflow_dispatch,
# so nothing runs on changes. To turn CI on, add push and pull_request
# under `on:`, run actionlint, and it is live.
name: check

on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
