name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GOWORK: "off"

jobs:
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web test && pnpm --dir web typecheck && pnpm --dir web build
      - run: tar -C web/dist -czf wada-web-dist.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: wada-web-dist
          path: wada-web-dist.tar.gz

  headless-archives:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build headless suite
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          for cmd in wadad wadad-term wada-relay wada; do
            go build -trimpath -ldflags="-s -w" -o "dist/${cmd}${ext}" "./cmd/${cmd}"
          done
          tar -C dist -czf "wada-headless-${GOOS}-${GOARCH}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: wada-headless-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wada-headless-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make licenses-check && go tool mygo build
      # The disk image holds the app; the .app bundle itself is a directory,
      # which publish would otherwise flatten into loose files.
      - uses: actions/upload-artifact@v4
        with:
          name: wada-desktop-macos
          path: build/*.dmg
          if-no-files-found: error

  docker-images:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Emulation for the linux/arm64 stages, whose RUN steps execute arm64
      # binaries on this amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wada-relay:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/wada-relay:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.wadad
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wadad:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/wadad:latest

  publish:
    needs: [web-bundle, headless-archives, desktop-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          mkdir -p release-files
          find artifacts -type f -exec mv {} release-files/ \;
          (cd release-files && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
