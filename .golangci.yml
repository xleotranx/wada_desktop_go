# The lint set is deliberately small and probationary: every check here
# must catch what go vet cannot without crying wolf. Grow it on purpose;
# drop a check the moment its noise outweighs its findings.
version: "2"

linters:
  default: none
  enable:
    - exhaustive # block, event and command dispatch name every member
    - depguard # pure model, protocol and worker dependencies point outward
    - ineffassign
    - staticcheck
    - unused
  settings:
    exhaustive:
      # A default case catches the zero value; every named member must
      # still stand above it as its own case.
      default-signifies-exhaustive: false
    depguard:
      rules:
        kernel:
          files: ["**/internal/kernel/**/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "wada-desktop-go/internal/kernel"]
        contract:
          files: ["**/internal/contract/**/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "wada-desktop-go/internal/kernel", "wada-desktop-go/internal/contract"]
        plugins:
          files: ["**/internal/plugins/**/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo"
            - "github.com/oneo-me/onevra/source"
            - "wada-desktop-go/internal/kernel"
            - "wada-desktop-go/internal/contract"
            - "wada-desktop-go/internal/shell"
            - "wada-desktop-go/internal/native"
        chat:
          files: ["**/internal/chat/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd"]
          deny:
            - pkg: encoding/json
              desc: Decode wire data in internal/opencode.
            - pkg: os
              desc: Chat transitions must not perform I/O.
            - pkg: net
              desc: Chat transitions must not perform I/O.
            - pkg: io
              desc: Chat transitions must not perform I/O.
            - pkg: syscall
              desc: Chat transitions must not perform I/O.
        agent:
          files: ["**/internal/agent/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd"]
        workspace:
          files: ["**/internal/workspace/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "wada-desktop-go/internal/agent"]
        opencode:
          files: ["**/internal/opencode/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "wada-desktop-go/internal/agent", "wada-desktop-go/internal/workspace"]
        runner:
          files: ["**/internal/runner/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "wada-desktop-go/internal/agent", "wada-desktop-go/internal/chat"]
        desktop:
          files: ["**/internal/desktop/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo"
            - "github.com/oneo-me/onevra/source"
            - "wada-desktop-go/internal/agent"
            - "wada-desktop-go/internal/chat"
            - "wada-desktop-go/internal/runner"
            - "wada-desktop-go/internal/feature"
            - "wada-desktop-go/internal/native"
            - "wada-desktop-go/internal/workspace"
          deny:
            - pkg: "wada-desktop-go/internal/features"
              desc: Install concrete feature modules in main.go.
        features:
          files: ["**/internal/features/**/*.go", "!$test"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/egoist/mygo"
            - "github.com/oneo-me/onevra/source"
            - "wada-desktop-go/internal/feature"
            - "wada-desktop-go/internal/native"
            - "wada-desktop-go/internal/workspace"
        feature:
          files: ["**/internal/feature/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "github.com/egoist/mygo/ui", "wada-desktop-go/internal/workspace"]
        native:
          files: ["**/internal/native/*.go", "!$test"]
          list-mode: strict
          allow: ["$gostd", "github.com/egoist/mygo/ui", "github.com/oneo-me/onevra/source"]
