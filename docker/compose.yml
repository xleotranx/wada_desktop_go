services:
  wada-relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
    restart: unless-stopped
    environment:
      WADA_RELAY_LISTEN: ":8787"
      WADA_RELAY_TOKEN: "${WADA_RELAY_TOKEN:-}"
      # Caddy reaches the relay from the compose network: trust its
      # X-Forwarded-For so wadad throttles failed sign-ins per client.
      WADA_RELAY_TRUSTED_PROXIES: "${WADA_RELAY_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,fc00::/7}"
    # Loopback only unless WADA_RELAY_BIND says otherwise: with the tls
    # profile, Caddy reaches the relay over the compose network, and a public
    # plaintext port would carry the relay token unencrypted.
    ports:
      - "${WADA_RELAY_BIND:-127.0.0.1}:${WADA_RELAY_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "/wada-relay", "-check", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - wada-relay
    environment:
      WADA_RELAY_DOMAIN: "${WADA_RELAY_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  wadad:
    build:
      context: ..
      dockerfile: docker/Dockerfile.wadad
    profiles: ["daemon"]
    restart: unless-stopped
    environment:
      WADA_PASSWORD: "${WADA_PASSWORD:-}"
      WADA_HOSTNAMES: "${WADA_HOSTNAMES:-localhost}"
      WADA_RELAY_URL: "${WADA_RELAY_URL:-}"
      WADA_RELAY_TOKEN: "${WADA_RELAY_TOKEN:-}"
      WADA_APP_URL: "${WADA_APP_URL:-https://app.wada.dev}"
    # Loopback only unless WADA_DAEMON_BIND says otherwise; remote clients
    # should come through the relay.
    ports:
      - "${WADA_DAEMON_BIND:-127.0.0.1}:6767:6767"
    volumes:
      - wadad_data:/data
      - "${WADA_WORKSPACES_DIR:-./workspaces}:/workspaces"

volumes:
  caddy_data:
  caddy_config:
  wadad_data:
